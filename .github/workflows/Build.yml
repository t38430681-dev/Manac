      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Simulador do controlador
        working-directory: proj
        run: python sim/simulate.py
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Aceitar licencas do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Build APK
        working-directory: proj
        run: gradle :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ManaControlBot-apk
          path: proj/app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ManaControlBot-fonte
          path: |
            proj
            !proj/app/build
            !proj/.gradle
